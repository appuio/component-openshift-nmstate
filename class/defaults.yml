parameters:
  openshift_nmstate:
    =_metadata:
      multi_tenant: true

    # The operator will unconditionally install the instance in namespace
    # `openshift-nmstate`, so we don't even try to fight against that.
    =_namespace: openshift-nmstate

    olm:
      channel: stable
      installPlanApproval: Automatic

    # This flag deploys an Espejote ManagedResource which watches
    # nmstate-handler pods and deletes ones that have impossible node
    # selectors.
    schedulingFix: true

    config: {}

    policies: {}

    staticRoutes: {}

    egressIPRanges: {}
