apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  labels:
    name: node-labels-manager
  name: node-labels-manager
  namespace: openshift-nmstate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  annotations: {}
  labels:
    name: appuio-openshift-nmstate-node-labels-manager
  name: appuio:openshift-nmstate:node-labels-manager
rules:
  - apiGroups:
      - nmstate.io
    resources:
      - nodenetworkstates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations: {}
  labels:
    name: appuio-openshift-nmstate-node-labels-manager
  name: appuio:openshift-nmstate:node-labels-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: appuio:openshift-nmstate:node-labels-manager
subjects:
  - kind: ServiceAccount
    name: node-labels-manager
    namespace: openshift-nmstate
